name: INTEL CI
on:
  workflow_dispatch:
  push:
    branches: [intel-v2-build]
    paths: ['intel/**', '.github/workflows/intel-ci.yml']
  pull_request:
    paths: ['intel/**', '.github/workflows/intel-ci.yml']
permissions:
  contents: read
concurrency:
  group: intel-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: intel/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
