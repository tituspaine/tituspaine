name: Personal site checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'editorial.css', 'tests/**', '.github/workflows/personal-site-ci.yml']
  pull_request:
    branches: [main]
    paths: ['index.html', 'editorial.css', 'tests/**', '.github/workflows/personal-site-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
